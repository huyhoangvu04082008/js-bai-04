<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Bài 4 - To-Do List jQuery</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <style>
      body {
        font-family: Arial, sans-serif;
        max-width: 400px;
        margin: 40px auto;
      }
      input {
        padding: 8px;
        width: 70%;
      }
      button {
        padding: 8px 12px;
        cursor: pointer;
      }
      li {
        margin: 8px 0;
        display: flex;
        justify-content: space-between;
        background: #f2f2f2;
        padding: 8px;
      }
    </style>
  </head>
  <body>
    <h3>Danh sách việc cần làm (jQuery)</h3>
    <input type="text" id="taskInput" placeholder="Nhập công việc mới..." />
    <button id="btnAdd">Thêm</button>
    <ul id="taskList" style="padding: 0; list-style: none"></ul>

    <script>
      $(document).ready(function () {
        $("#btnAdd").click(function () {
          let task = $("#taskInput").val().trim();
          if (task !== "") {
            $("#taskList").append(
              `<li><span>${task}</span> <button class="btnDel">Xóa</button></li>`,
            );
            $("#taskInput").val("");
          }
        });

        // Xóa phần tử được thêm động
        $("#taskList").on("click", ".btnDel", function () {
          $(this).parent().remove();
        });
      });
    </script>
  </body>
</html>
